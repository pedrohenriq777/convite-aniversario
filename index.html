<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festa do Dino Pool 🦖</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--wood:#5a3418;--cream:#fff3cf;--lil:'Lilita One','Baloo 2',Impact,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:#0f4a33;color:#4a2c12;overflow-x:hidden}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.palm{position:absolute;width:clamp(150px,30vw,320px)}
.palm.tl{top:-10px;left:-10px}.palm.tr{top:-10px;right:-10px;transform:scaleX(-1)}
.palm.bl{bottom:-10px;left:-10px;transform:scaleY(-1)}.palm.br{bottom:-10px;right:-10px;transform:scale(-1)}
.fr{transform-box:fill-box;transform-origin:0 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(7deg)}}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe98a;box-shadow:0 0 10px 3px #ffe98a99;animation:ff var(--t) ease-in-out infinite alternate}
@keyframes ff{from{opacity:.1;transform:translate(0,0)}to{opacity:1;transform:translate(var(--x),var(--y))}}
.paw{position:absolute;width:44px;opacity:.12;transform:rotate(var(--r))}
/* intro */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,#45ad5e,#16623a 60%,#0b3d26);transition:opacity .9s}
#intro.fade{opacity:0;pointer-events:none}
.hello{position:relative;z-index:2}
.hello h2{font:400 clamp(26px,6vw,44px)/1.1 var(--lil);color:var(--cream);text-shadow:0 3px 0 #0b3d26,0 8px 18px #0008;animation:rise .8s .1s both}
.env{position:relative;width:min(78vw,340px);aspect-ratio:3/2;margin:34px auto 38px;animation:envIn 1.1s cubic-bezier(.2,.9,.3,1.15) .2s both;filter:drop-shadow(0 18px 20px #0007)}
@keyframes envIn{from{opacity:0;transform:translateY(60px) scale(.8) rotate(-4deg)}}
.env>*{position:absolute}
.env .back{inset:0;background:#c79c5c;border-radius:8px}
.env .card{left:7%;right:7%;top:8%;bottom:8%;background:#fff6dc;border-radius:6px;display:grid;place-items:center;font:400 28px var(--lil);color:var(--wood);z-index:2;transition:transform 1s .55s cubic-bezier(.3,.8,.3,1)}
.env.open .card{transform:translateY(-58%)}
.env .pocket{inset:0;z-index:3;border-radius:8px;background:linear-gradient(#e2bd82,#d1a468);clip-path:polygon(0 36%,50% 66%,100% 36%,100% 100%,0 100%)}
.env .flap{left:0;right:0;top:0;height:66%;z-index:4;transform-origin:top;background:linear-gradient(#ebcb92,#d8ad6f);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .75s,z-index 0s .35s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{left:50%;top:58%;width:50px;height:50px;margin:-25px;border-radius:50%;z-index:5;background:radial-gradient(#e0473a,#a3201a);display:grid;place-items:center;font-size:26px;box-shadow:0 3px 6px #0006;transition:opacity .3s}
.env.open .seal{opacity:0}
.btn,.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 34px;border-radius:999px;font:400 clamp(20px,5vw,26px) var(--lil);letter-spacing:.5px;color:#fff;text-decoration:none;border:4px solid var(--cream);cursor:pointer;background:linear-gradient(#ffa13a,#f0701a);box-shadow:0 6px 0 #a24a0c,0 14px 24px #0005;text-shadow:0 2px 0 #0004}
.btn{animation:rise .8s 1s both}
.btn:active,.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a24a0c}
/* invite */
#invite{display:none;position:relative;min-height:100svh;background:linear-gradient(#bfe8ee 0,#d6eed2 35%,#f2e3b9 100%);overflow:hidden}
#invite.on{display:block}
.rise{animation:rise .9s calc(var(--d,0s) + .5s) cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}}
.bunting{position:relative;z-index:2;display:flex;justify-content:center;gap:clamp(6px,2vw,22px);padding-top:6px}
.bunting:before{content:"";position:absolute;left:0;right:0;top:4px;height:3px;background:#8a5a2b}
.pen{width:clamp(54px,12vw,100px);aspect-ratio:.86;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);background:linear-gradient(#f1d49a,#dcb272);display:grid;place-items:start center;padding-top:14%;transform-origin:top;animation:swing 3.4s ease-in-out infinite alternate;animation-delay:var(--s)}
.pen svg{width:62%}
@keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.sc{position:relative;container-type:inline-size;display:grid;max-width:520px;margin:0 auto;padding:6px 14px calc(34px + env(safe-area-inset-bottom,0px));gap:14px;justify-items:center}
.title{grid-area:1/1;text-align:center;font:400 min(13vw,66px)/.95 var(--lil);-webkit-text-stroke:8px var(--wood);paint-order:stroke fill;text-shadow:0 6px 0 #3b2210;letter-spacing:1px}
.title span{display:block;color:#e8b97c;font-size:.82em}.title b{font-weight:400;display:block;color:#ffa229}.title i{font-style:normal;color:#35c4b8}
.art{grid-area:2/1;position:relative;width:100%;aspect-ratio:760/852;border-radius:22px;overflow:hidden;container-type:inline-size;box-shadow:0 0 0 5px #e3bd7a,0 14px 24px #0006;background:#7fd0ea}
.art>*{position:absolute;pointer-events:none}
.art .base{inset:0;width:100%;height:100%;display:block}
.plate{grid-area:2/1;z-index:3;align-self:start;width:62%;height:29.5%;margin-top:.6%;display:flex;flex-direction:column;justify-content:center;text-align:center;font-weight:700;font-size:4.5cqw;line-height:1.22;color:#3d2a14;background:linear-gradient(145deg,#d9d3c4,#bdb6a4);border:4px solid #8f8878;border-radius:14px;box-shadow:inset 0 0 14px #7a735f88,0 8px 16px #0004}
.plate b{font-weight:800}
.msgbox{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.tip{font:400 clamp(20px,5.4vw,28px)/1.15 var(--lil);text-align:center;color:var(--wood)}
.q{max-width:440px;width:100%;padding:20px 34px;text-align:center;font-weight:700;font-size:clamp(17px,4.6vw,22px);line-height:1.25;color:#3d2a14;background:linear-gradient(#f8e9c0,#ecd29a);border-radius:10px;border-left:14px solid #c99a5a;border-right:14px solid #c99a5a;box-shadow:0 8px 14px #0004}
.cta{background:linear-gradient(#41d36b,#1fa24a);box-shadow:0 6px 0 #0f6a2e,0 14px 24px #0005;animation:pulse 2.4s ease-in-out infinite}
.cta:active{box-shadow:0 2px 0 #0f6a2e}
@keyframes pulse{50%{transform:scale(1.04)}}
/* camadas animadas */
.sw,.dg,.hd,.fw u{will-change:transform}
.sw{transform-origin:var(--o);animation:swy var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes swy{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(var(--a))}}
.pl,.fl{inset:0;clip-path:var(--cp)}
.pl i{position:absolute;inset:-12%;opacity:.5;will-change:background-position;background:radial-gradient(ellipse 3.4cqw 1.1cqw at 50% 50%,#fff,#fff0 70%) 0 0/9cqw 5cqw;animation:cau 14s linear infinite}
.pl i.b{opacity:.4;background:radial-gradient(ellipse 5cqw 1.4cqw at 40% 50%,#fffd,#fff0 70%) 3cqw 2cqw/13cqw 7cqw;animation:cau2 19s linear infinite}
@keyframes cau{to{background-position:9cqw 5cqw}}@keyframes cau2{to{background-position:-10cqw 9cqw}}
.fw{position:absolute;left:-50%;top:-50%;width:200%;height:200%;transform:rotate(var(--fa))}
.fw u{position:absolute;inset:0}
.fw u:nth-child(1){background:repeating-linear-gradient(90deg,#fff0 0 .5cqw,#ffffffb0 .5cqw .8cqw,#fff0 .8cqw 1.7cqw);opacity:.45;animation:shim 1.6s ease-in-out infinite alternate}
.fw u:nth-child(2){background:repeating-linear-gradient(180deg,#fff0 0 2cqw,#ffffffcc 2.6cqw 3.2cqw,#fff0 3.8cqw 6.4cqw);opacity:.5;animation:flow .8s linear infinite}
.fw u:nth-child(3){background:repeating-linear-gradient(180deg,#bfeaff00 0 4cqw,#d9f4ffaa 5cqw 6cqw,#bfeaff00 7cqw 11cqw);opacity:.55;animation:flow2 1.3s linear infinite}
@keyframes flow{to{transform:translateY(6.4cqw)}}@keyframes flow2{to{transform:translateY(11cqw)}}@keyframes shim{to{opacity:.2}}
.fw u:nth-child(2),.fw u:nth-child(3){top:-12cqw;bottom:0}
.spl{width:1cqw;height:1cqw;border-radius:50%;background:#fff;opacity:0;animation:spl 1.3s ease-out infinite;animation-delay:var(--dl)}
@keyframes spl{0%{opacity:.9;transform:translate(0,0)}60%{opacity:.8;transform:translate(var(--dx),-3.4cqw)}100%{opacity:0;transform:translate(calc(var(--dx)*1.5),.5cqw)}}
.lv{border-radius:50%;background:radial-gradient(circle,#ffb52eee,#ff6a0000 70%);mix-blend-mode:screen;animation:lv 3.2s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes lv{from{opacity:.25;transform:scale(.9)}to{opacity:.9;transform:scale(1.12)}}
.em{width:.7cqw;height:.7cqw;border-radius:50%;background:#ffb52e;box-shadow:0 0 6px #ff7a00;opacity:0;animation:em 3.4s ease-out infinite;animation-delay:var(--dl)}
@keyframes em{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-7cqw)}}
.rp{border:.25cqw solid #ffffffcc;border-radius:50%;opacity:0;animation:rp 4s ease-out infinite;animation-delay:var(--dl)}
@keyframes rp{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
.dg{transform-origin:50% 85%;animation:bob var(--t) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-.7deg)}to{transform:translateY(-.4cqw) rotate(.7deg)}}
.dg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hd{position:absolute;transform-origin:var(--o);animation:nod 3.6s ease-in-out infinite alternate}
.hd img{inset:auto;position:relative}
@keyframes nod{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
.lid{position:absolute;border-radius:50%;background:var(--c);transform:scaleY(0);transform-origin:top;animation:blink 5s infinite;animation-delay:var(--dl)}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.sp{color:#fff;font-size:3.2cqw;line-height:1;text-shadow:0 0 6px #fff;animation:tw 2.4s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes tw{from{opacity:.05;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.lf{width:2.2cqw;height:1.2cqw;background:#3fb257;border-radius:0 100% 0 100%;opacity:.85;left:0;animation:lfd var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes lfd{from{transform:translate(-5cqw,0) rotate(0)}50%{transform:translate(55cqw,4cqw) rotate(200deg)}to{transform:translate(108cqw,1cqw) rotate(420deg)}}
@media (min-width:900px) and (orientation:landscape){
 .bunting{display:none}
 #invite.on{display:grid;place-items:center;background:linear-gradient(#7cc58b,#2f8f4b)}
 .sc{width:min(100vw,177.78svh);max-width:none;aspect-ratio:16/9;display:block;padding:0}
 .art{position:absolute;inset:0;width:auto;aspect-ratio:auto;border-radius:0;box-shadow:none}
 .title{position:absolute;z-index:3;left:32.6%;width:35.8%;top:20.2%;font-size:3.05cqw;white-space:nowrap;-webkit-text-stroke:.5cqw var(--wood);text-shadow:0 .3cqw 0 #3b2210}
 .title span,.title b{display:inline}.title span{font-size:1em}
 .plate{position:absolute;left:32.6%;width:35.8%;top:28.6%;height:10.6%;margin:0;background:none;border:0;box-shadow:none;font-size:1.62cqw;padding:0;color:#4a2c12}
 .msgbox{position:absolute;left:14.5%;width:33%;top:84.6%;height:12.4%;gap:.3cqw;justify-content:center;padding:.4cqw 1.6cqw;background:linear-gradient(#f8e9c0,#ecd29a);border-radius:.8cqw;border-left:1.1cqw solid #c99a5a;border-right:1.1cqw solid #c99a5a;box-shadow:0 .6cqw 1.2cqw #0005;z-index:3;width:33%}
 .tip{font-size:1.38cqw;white-space:nowrap}.q{font-size:1.18cqw;padding:0;background:none;border:0;box-shadow:none;max-width:none}
 .go{position:absolute;left:49.6%;top:86.2%;z-index:3}
 .cta{min-height:0;height:5.6cqw;font-size:1.7cqw;padding:0 2.2cqw;border-width:.3cqw;box-shadow:0 .4cqw 0 #0f6a2e,0 1cqw 1.6cqw #0005;gap:.7cqw}
}
@media (max-width:899px){.lf,.pl i.b{display:none}.pl i{opacity:.35}}
@media (min-width:900px) and (orientation:landscape){.pl i{mix-blend-mode:screen}}
@media (prefers-reduced-motion:reduce){.spl,.em,.lf,.rp{display:none}}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}

 <div class="bg" id="bgI"></div>
 <div class="hello">
  <h2>Você recebeu um convite especial!</h2>
  <div class="env" id="env"><div class="back"></div><div class="card">🦖 Dino Pool</div><div class="pocket"></div><div class="flap"></div><div class="seal">🦖</div></div>
  <button class="btn" id="open">ABRIR CONVITE</button>
 </div>
</section>

<main id="invite">
 <div class="bunting" id="bunt" aria-hidden="true"></div>
 <div class="sc">
  <h1 class="title rise"><span>FESTA DO</span> <b>DINO <i>POOL</i></b></h1>
  <div class="art rise" id="art" role="img" aria-label="Cenário tropical com vulcão, cachoeira, piscina com dois dinossauros e o bebê fantasiado de dinossauro" style="--d:.3s"></div>
  <div class="plate rise" style="--d:.6s"><p><b>DATA:</b> 13/12/2026</p><p><b>HORÁRIO:</b> 14:00 horas</p><p><b>LOCAL:</b> Rua Cidade de Cubatão, 281</p></div>

const WHATSAPP_NUMBER = "5513991987871";
const message = "Olá! Estou passando para confirmar minha presença na Festa do Dino Pool! 🦖🎉";
const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
document.getElementById('wa').href = whatsappLink;

const small = innerWidth < 700;
const paw = '<svg viewBox="0 0 40 40"><g fill="#7a4a24"><ellipse cx="20" cy="27" rx="10" ry="8"/><ellipse cx="8" cy="14" rx="4" ry="6" transform="rotate(-20 8 14)"/><ellipse cx="20" cy="9" rx="4" ry="7"/><ellipse cx="32" cy="14" rx="4" ry="6" transform="rotate(20 32 14)"/></g></svg>';
function palm(){
  const c=['#2e9a46','#1f7a36','#3fb257'];
  return '<svg viewBox="0 -40 150 190">'+[-8,18,44,70,96,122].map((a,i)=>`<g transform="rotate(${a})"><path class="fr" style="animation-delay:${i*.5}s" d="M0 0C30-26 80-34 130-8C90-12 50-6 0 0Z" fill="${c[i%3]}"/></g>`).join('')+'</svg>';
}
function fill(id,white){
  const el=document.getElementById(id);
  let h=['tl','tr','bl','br'].map(p=>`<div class="palm ${p}">${palm()}</div>`).join('');
  const n=small?12:24;
  for(let i=0;i<n;i++)h+=`<i class="ff" style="left:${Math.random()*100}%;top:${Math.random()*100}%;--t:${3+Math.random()*4}s;--x:${(Math.random()-.5)*40}px;--y:${-10-Math.random()*40}px"></i>`;
  if(white)for(let i=0;i<7;i++)h+=`<div class="paw" style="left:${8+Math.random()*80}%;top:${8+Math.random()*80}%;--r:${Math.random()*80-40}deg">${paw.replace(/#7a4a24/g,'#fff')}</div>`;
  el.innerHTML=h;
}
fill('bgI',true);
document.getElementById('bunt').innerHTML=[0,1,2,3,4].map(i=>`<div class="pen" style="--s:${-i*.6}s">${paw}</div>`).join('');

document.getElementById('open').addEventListener('click',e=>{
  e.currentTarget.disabled=true;e.currentTarget.style.opacity=.5;
  document.getElementById('env').classList.add('open');
  setTimeout(()=>{document.getElementById('invite').classList.add('on');scrollTo(0,0);document.getElementById('intro').classList.add('fade')},1500);
  setTimeout(()=>document.getElementById('intro').remove(),2600);

const mq=matchMedia('(min-width:900px) and (orientation:landscape)'),art=document.getElementById('art');
const P=(x,y,S)=>[(x-S.ox)/S.W*100,(y-S.oy)/S.H*100];
const poly=(a,S)=>'polygon('+a.map(p=>P(p[0],p[1],S).map(v=>v.toFixed(2)+'%').join(' ')).join(',')+')';
const bx=(b,S)=>{const[x,y]=P(b[0],b[1],S);return `left:${x}%;top:${y}%;width:${(b[2]-b[0])/S.W*100}%;height:${(b[3]-b[1])/S.H*100}%`};
const at=(x,y,S)=>{const p=P(x,y,S);return `left:${p[0]}%;top:${p[1]}%`};
const inP=(x,y,p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++)if((p[i][1]>y)!=(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c;return c};
const R=(a,b)=>a+Math.random()*(b-a);
function build(){
 const S=mq.matches?SC.d:SC.m;
 let h=`<img class="base" src="${S.base}" alt="">`;
 h+=`<div class="pl" style="--cp:${poly(S.pool,S)}"><i></i><i class="b"></i></div>`;
 S.dn.forEach((d,n)=>{
  const[x,y,w,hh]=d.rp;
  for(let k=0;k<3;k++)h+=`<b class="rp" style="${bx([x-w/2,y-hh/2,x+w/2,y+hh/2],S)};--dl:${k*1.3+n*.5}s"></b>`;
  const b=d.box,hb=d.hb,bw=b[2]-b[0],bh=b[3]-b[1],hw=hb[2]-hb[0],hh2=hb[3]-hb[1],[ex,ey,er]=d.eye;
  h+=`<div class="dg" style="${bx(b,S)};--t:${d.t}s"><img src="${d.src}" alt="">`+
   `<div class="hd" style="left:${(hb[0]-b[0])/bw*100}%;top:${(hb[1]-b[1])/bh*100}%;width:${hw/bw*100}%;height:${hh2/bh*100}%;--o:${d.ho}"><img src="${d.head}" alt="">`+
   `<i class="lid" style="left:${(ex-hb[0]-1.3*er)/hw*100}%;top:${(ey-hb[1]-1.2*er)/hh2*100}%;width:${2.6*er/hw*100}%;height:${2.4*er/hh2*100}%;--c:${d.c};--dl:-${R(0,4).toFixed(1)}s"></i></div></div>`;
 });
 h+=`<div class="fl" style="--cp:${poly(S.fall,S)}"><div class="fw" style="--fa:${S.fa}"><u></u><u></u><u></u></div></div>`;
 for(let i=0;i<8;i++)h+=`<s class="spl" style="${at(S.splash[0]+R(-28,28)*S.W/900,S.splash[1]+R(-6,4),S)};--dx:${R(-3,3).toFixed(1)}cqw;--dl:-${R(0,1.3).toFixed(2)}s"></s>`;
 S.sw.forEach(l=>h+=`<img class="sw" alt="" src="${l.src}" style="${bx(l.box,l)};--o:${l.o};--a:${l.a}deg;--t:${l.t}s;--dl:-${R(0,4).toFixed(1)}s">`.replace(bx(l.box,l),bx(l.box,S)));
 S.lava.forEach((l,i)=>{h+=`<i class="lv" style="${bx([l[0]-l[2],l[1]-l[2],l[0]+l[2],l[1]+l[2]],S)};--dl:-${i*1.4}s"></i>`});
